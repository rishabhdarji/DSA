name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Smoke test interactive scripts
        shell: bash
        run: |
          printf '153\n' | python armstrong.py
          printf '36\n' | python basicmath.py
          printf '5\n' | python pattern.py
          python compare.py
          python freq_map.py

  cpp:
    name: C++ compilation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile C++ source
        run: g++ -std=c++17 -Wall -Wextra -pedantic LearnC++.cpp -o LearnC++
